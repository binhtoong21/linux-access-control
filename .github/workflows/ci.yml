name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts (vectors reproducible)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Regenerate crypto vectors and compare
        run: python -I contracts/tools/gen_vectors.py | diff - contracts/vectors/crypto-v1.json

  edge:
    name: Edge (Python 3.10, Ubuntu 22.04)
    runs-on: ubuntu-22.04
    defaults: { run: { working-directory: edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  server:
    name: Server (Node 20)
    runs-on: ubuntu-22.04
    defaults: { run: { working-directory: server } }
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nfclab_test
          POSTGRES_USER: nfclab
          POSTGRES_PASSWORD: nfclab-dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nfclab -d nfclab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nfclab:nfclab-dev@127.0.0.1:5432/nfclab_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: server/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
