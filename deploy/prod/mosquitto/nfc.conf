# Ubuntu's main config includes conf.d and already sets /var/lib/mosquitto persistence_location.
# A configured listener suppresses Mosquitto's implicit localhost:1883 listener.
# Global ACL / certificate identity matches the dev broker; this must precede auth options.
per_listener_settings false
persistence true
listener 8883
require_certificate true
use_identity_as_username true
cafile /etc/nfc-server/ca-public/ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile /etc/mosquitto/certs/broker.key
crlfile /var/lib/nfc-server-crl/crl.pem
acl_file /etc/mosquitto/nfc-acl.conf
