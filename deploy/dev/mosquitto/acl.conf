# ADR-002 §1: each workstation reads/writes only its own topics (%u = certificate CN).
pattern read lab/workstation/%u/snapshot
pattern read lab/workstation/%u/lease
pattern read lab/workstation/%u/command/#
pattern write lab/workstation/%u/hello
pattern write lab/workstation/%u/heartbeat
pattern write lab/workstation/%u/outbox
pattern write lab/workstation/%u/status

user nfc-server
topic read lab/workstation/+/hello
topic read lab/workstation/+/heartbeat
topic read lab/workstation/+/outbox
topic read lab/workstation/+/status
topic write lab/workstation/+/snapshot
topic write lab/workstation/+/lease
topic write lab/workstation/+/command/#
